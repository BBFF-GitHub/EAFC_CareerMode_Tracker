<div class="row">
  <div class="col-lg-8 col-md-8 col-sm-8">
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-4">
        <label style="font-weight: bold;">Old Club</label>
      </div>
      <div class="col-lg-8 col-md-8 col-sm-8">
        <p style="padding-left: 0.8rem;">{{oldClub}}</p>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-4">
        <label class="club-label">New Club</label>
      </div>
      <div class="col-lg-8 col-md-8 col-sm-8">
        <p-select [options]="teams" [(ngModel)]="player.currentClub" [filter]="true"></p-select>
      </div>
    </div>
  </div>
  <div class="col-lg-4 col-md-4 col-sm-4">
    <td style="margin-left: auto; margin-right: auto; display: block">
      <img class="player-big-img" src="{{bigPhoto}}" alt="{{player.player}}" />
    </td>
  </div>
</div>
<br />
<br />
<hr />
<p-button type="button" label="Save Club Change" class="p-button" (click)="saveClubChange()"></p-button>
