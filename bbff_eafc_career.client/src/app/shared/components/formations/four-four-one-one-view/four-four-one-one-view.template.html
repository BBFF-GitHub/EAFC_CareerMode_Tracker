<!-- GK ROWS -->
<div class="row formation-table formation-row">
  <div class="col-lg-4 col-md-4 col-sm-4"></div>
  <div class="col-lg-4 col-md-4 col-sm-4">
    <player-table [squadList]="gkList" [title]="'Goalkeepers'" [code]="'GK'" [cssClass]="'pos-gk-background'"
                  [fromOverview]="fromOverview" (addPlayerEmit)="addPlayer($event)" (reorderEmit)="finishReorder($event)"></player-table>
  </div>
  <div class="col-lg-4 col-md-4 col-sm-4"></div>
</div>
