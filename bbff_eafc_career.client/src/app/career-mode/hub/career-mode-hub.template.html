<div *ngIf="loading" class="loading-div">
  <p-progressSpinner [style]="{width: '45px', height: '45px', 'margin-left': '-0.5rem', 'margin-top': '0.5rem'}" strokeWidth="6"></p-progressSpinner>
  <b class="loading">Loading...</b>
</div>

<div *ngIf="!loading">
  <div *ngIf="newCareer" class="new-career-div">
    <div class="new-career-heading">
      <div class="new-career-badge">New Career</div>
      <h1 class="new-career-title">How do you want to start?</h1>
    </div>

    <div class="new-career-cards">
      <button type="button" class="new-career-card" (click)="startCareer('Authentic Club')">
        <div class="new-career-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#06421F" stroke-width="1.8"><path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 16.8 6.5 20l1-6.5L3 9l6-1 3-6z"/></svg>
        </div>
        <div class="new-career-card-title">Use Authentic Club</div>
        <div class="new-career-card-text">Take charge of a real club, in a real league, with its real players and colours.</div>
        <div class="new-career-select">Select</div>
      </button>

      <button type="button" class="new-career-card" (click)="startCareer('Custom Club')">
        <div class="new-career-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#06421F" stroke-width="1.8"><path d="M12 19V5M5 12h14"/></svg>
        </div>
        <div class="new-career-card-title">Create Custom Club</div>
        <div class="new-career-card-text">Build a brand new club from scratch - name, colours, league and all.</div>
        <div class="new-career-select">Select</div>
      </button>
    </div>
  </div>

  <div *ngIf="!newCareer">
    <current-season *ngIf="viewModeClub" [careerId]="careerModeId" [year]="year" (switchModeEmit)="switchView()"></current-season>
    <international-view *ngIf="!viewModeClub" [careerId]="careerModeId" [year]="year" (switchModeEmit)="switchView()"></international-view>
  </div>
</div>

<p-dialog header="{{modalHeader}}" [(visible)]="showModal" [modal]="true" [style]="{width: '50vw'}"
          [draggable]="false" [resizable]="false">
  <authentic-club-modal *ngIf="modalMode == 'authentic-club-modal'"></authentic-club-modal>
  <new-custom-team-modal *ngIf="modalMode == 'new-custom-team-modal'"></new-custom-team-modal>
</p-dialog>
